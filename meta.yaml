# ========== 安卓 CMFA 专属优化配置 ==========
mixed-port: 7890
log-level: info
allow-lan: false
bind-address: 127.0.0.1
mode: rule
external-controller: 127.0.0.1:9090
secret: ""

# 移动端 TUN 优化（手机专用，稳定低耗电）
tun:
  enable: true
  stack: gvisor
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# 订阅节点 + 健康检查（自动剔除超时节点）
proxy-providers:
  shaoyouvip:
    type: http
    url: "https://ghproxy.net/https://raw.githubusercontent.com/shaoyouvip/free/refs/heads/main/mihomo.yaml"
    interval: 21600
    path: ./proxy/shaoyouvip.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
      timeout: 3000
  kooker:
    type: http
    url: "https://ghproxy.net/https://raw.githubusercontent.com/kooker/FreeSubsCheck/main/mihomo.yaml"
    interval: 21600
    path: ./proxy/kooker.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
      timeout: 3000
  nodesfree:
    type: http
    url: "https://ghproxy.net/https://raw.githubusercontent.com/nodesfree/clashnode/refs/heads/main/clash.yaml"
    interval: 21600
    path: ./proxy/nodesfree.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
      timeout: 3000

# 地理规则库（适配移动端）
geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"

# 移动端 DNS 精简稳定版（无报错、适配手机网络）
dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
  nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

# ========== 代理分组（核心：每个分组可单独手动选节点，默认自动） ==========
proxy-groups:
  - name: 默认
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: Google
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: TikTok
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: Telegram
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)(港|hk|台|tw|日|jp|美|us|新|sg)"
    exclude-filter: "(?i)回国|cn|china|移动|联通|电信"

  - name: Twitter
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: 哔哩哔哩
    type: select
    proxies: [直连, 自动选择, 延迟排序]
    include-all: true

  - name: 巴哈姆特
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: YouTube
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: NETFLIX
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: Spotify
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: Github
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: 其他
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  # 自动择优节点（自动过滤超时失效节点）
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 10
    include-all: true
    exclude-filter: "(?i)回国|cn|china|移动|联通|电信"

  # 延迟排序分组（手动选低延迟节点）
  - name: 延迟排序
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 1000
    include-all: true
    exclude-filter: "(?i)回国|cn|china|移动|联通|电信"

  # 国内回国节点
  - name: 国内节点
    type: select
    include-all: true
    filter: "(?i)回国|cn|china|移动|联通|电信"

# 内置直连节点
proxies:
  - name: "直连"
    type: direct
    udp: true

# ========== 分流规则（手机通用，稳定不卡顿） ==========
rules:
  - GEOIP,lan,直连,no-resolve
  - GEOSITE,private,直连,no-resolve
  - GEOSITE,category-ads-all,REJECT

  # 国内APP/网站强制直连
  - GEOSITE,cn,直连
  - GEOSITE,onedrive,直连
  - GEOSITE,microsoft@cn,直连
  - GEOSITE,apple-cn,直连
  - GEOSITE,steam@cn,直连
  - GEOSITE,category-games@cn,直连
  - GEOSITE,bilibili,直连

  # 国际服务分流
  - GEOSITE,biliintl,哔哩哔哩
  - GEOSITE,github,Github
  - GEOSITE,twitter,Twitter
  - GEOSITE,youtube,YouTube
  - GEOSITE,google,Google
  - GEOSITE,telegram,Telegram
  - GEOSITE,netflix,NETFLIX
  - GEOSITE,bahamut,巴哈姆特
  - GEOSITE,spotify,Spotify

  # Telegram IP 段规则
  - IP-CIDR,91.108.4.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.8.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.12.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.16.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.20.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.56.0/22,Telegram,no-resolve
  - IP-CIDR,149.154.160.0/20,Telegram,no-resolve
  - IP-CIDR,185.76.151.0/24,Telegram,no-resolve

  - GEOIP,private,直连,no-resolve
  - GEOIP,telegram,Telegram,no-resolve
  - GEOIP,twitter,Twitter,no-resolve
  - GEOIP,google,Google,no-resolve
  - GEOIP,netflix,NETFLIX,no-resolve
  - GEOIP,CN,直连,no-resolve

  - GEOSITE,category-scholar-!cn,默认
  - GEOSITE,geolocation-!cn,其他
  - DST-PORT,80/8080/443/8443,其他
  - MATCH,其他
