# 规则（参考配置规则集+原有规则融合）
rules:
  - PROCESS-NAME,subs-check.exe,🎯 全球直连
  - PROCESS-NAME,subs-check,🎯 全球直连

  - GEOIP,lan,🎯 全球直连,no-resolve
  - GEOSITE,private,🎯 全球直连,no-resolve
  - GEOSITE,category-ads-all,🚫 广告拦截

  # 国内直连
  - GEOSITE,cn,🎯 全球直连
  - GEOSITE,onedrive,🎯 全球直连
  - GEOSITE,microsoft@cn,🎯 全球直连
  - GEOSITE,apple-cn,🎯 全球直连
  - GEOSITE,steam@cn,🎯 全球直连
  - GEOSITE,category-games@cn,🎯 全球直连
  - GEOSITE,bilibili,📺 哔哩哔哩

  # 应用分流
  - GEOSITE,biliintl,📺 哔哩哔哩
  - GEOSITE,github,🧑‍💻 代码仓库
  - GEOSITE,twitter,🐦 推特社交
  - GEOSITE,youtube,📺 油管视频
  - GEOSITE,google,🔍 谷歌服务
  - GEOSITE,telegram,📱 电报消息
  - GEOSITE,netflix,🎬 奈飞视频
  - GEOSITE,bahamut,🧩 巴哈姆特
  - GEOSITE,spotify,🎵 声田音乐
  - GEOSITE,tiktok,🧪 抖音海外
  - GEOSITE,openai,🧪 AI平台

