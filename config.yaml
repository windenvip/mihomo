# 基础配置
mixed-port: 7890
socks-port: 7891
port: 7892
redir-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: '0.0.0.0:9090'
secret: ''

# 网络增强
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# 代理提供者（强化健康检查，自动剔除超时节点）
proxy-providers:
  shaoyouvip:
    type: http
    url: "https://ghproxy.net/https://raw.githubusercontent.com/shaoyouvip/free/refs/heads/main/mihomo.yaml"
    interval: 21600
    path: ./proxy/shaoyouvip.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
      timeout: 3000
  kooker:
    type: http
    url: "https://ghproxy.net/https://raw.githubusercontent.com/kooker/FreeSubsCheck/main/mihomo.yaml"
    interval: 21600
    path: ./proxy/kooker.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
      timeout: 3000
  nodesfree:
    type: http
    url: "https://ghproxy.net/https://raw.githubusercontent.com/nodesfree/clashnode/refs/heads/main/clash.yaml"
    interval: 21600
    path: ./proxy/nodesfree.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
      timeout: 3000

# 地理数据源
geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

# DNS配置（关键修正：nameserver-policy 全部用数组格式）
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
  nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query
    "geosite:geolocation-!cn":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
    "geosite:telegram":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query

# 代理分组（修正后，无语法错误）
proxy-groups:
  - name: 默认
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: Google
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: TikTok
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: Telegram
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)(港|hk|hongkong|台|tw|taiwan|日|jp|japan|美|us|unitedstates|新|sg|singapore)"
    exclude-filter: "(?i)回国|cn|china|移动|联通|电信"

  - name: Twitter
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: 哔哩哔哩
    type: select
    proxies: [直连, 自动选择, 延迟排序]
    include-all: true

  - name: 巴哈姆特
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: YouTube
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: NETFLIX
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: Spotify
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: Github
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  - name: 其他
    type: select
    proxies: [自动选择, 延迟排序, 直连]
    include-all: true

  # 自动择优，仅使用健康检测存活节点
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 10
    include-all: true
    exclude-filter: "(?i)回国|cn|china|移动|联通|电信"

  # 延迟排序，自动过滤超时节点
  - name: 延迟排序
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 1000
    include-all: true
    exclude-filter: "(?i)回国|cn|china|移动|联通|电信"

  # 国内节点组
  - name: 国内节点
    type: select
    include-all: true
    filter: "(?i)回国|cn|china|移动|联通|电信"

proxies:
  - name: "直连"
    type: direct
    udp: true

# 规则
rules:
  - GEOIP,lan,直连,no-resolve
  - GEOSITE,private,直连,no-resolve
  - GEOSITE,category-ads-all,REJECT

  - GEOSITE,cn,直连
  - GEOSITE,onedrive,直连
  - GEOSITE,microsoft@cn,直连
  - GEOSITE,apple-cn,直连
  - GEOSITE,steam@cn,直连
  - GEOSITE,category-games@cn,直连
  - GEOSITE,bilibili,直连

  - GEOSITE,biliintl,哔哩哔哩
  - GEOSITE,github,Github
  - GEOSITE,twitter,Twitter
  - GEOSITE,youtube,YouTube
  - GEOSITE,google,Google
  - GEOSITE,telegram,Telegram
  - GEOSITE,netflix,NETFLIX
  - GEOSITE,bahamut,巴哈姆特
  - GEOSITE,spotify,Spotify

  - IP-CIDR,91.108.4.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.8.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.12.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.16.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.20.0/22,Telegram,no-resolve
  - IP-CIDR,91.108.56.0/22,Telegram,no-resolve
  - IP-CIDR,149.154.160.0/20,Telegram,no-resolve
  - IP-CIDR,185.76.151.0/24,Telegram,no-resolve

  - GEOIP,private,直连,no-resolve
  - GEOIP,telegram,Telegram,no-resolve
  - GEOIP,twitter,Twitter,no-resolve
  - GEOIP,google,Google,no-resolve
  - GEOIP,netflix,NETFLIX,no-resolve
  - GEOIP,CN,直连,no-resolve

  - GEOSITE,category-scholar-!cn,默认
  - GEOSITE,geolocation-!cn,其他

  - DST-PORT,80/8080/443/8443,其他

  - MATCH,其他
